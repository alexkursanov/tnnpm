# configs/default.yaml
# Стандартная конфигурация модели TNNPM — 1 Гц, 500 циклов, изометрия
#
# Использование:
#   python scripts/run.py --config configs/default.yaml
#   python scripts/run.py --config configs/default.yaml --output data/my_run.h5
#
# Все поля опциональны — отсутствующие берутся из defaults TNNPMParams / SimConfig.
# Для sweep укажите список значений вместо скаляра:
#   g_CaL: [3.0e-5, 5.0e-5, 7.0e-5]

# ── Параметры модели ────────────────────────────────────────────────────────
params:
  # Стимуляция
  stim_period:    1000.0   # мс  (1 Гц)
  stim_start:     10.0     # мс
  stim_duration:  1.0      # мс
  stim_amplitude: 52.0     # пА/пФ

  # Электрическая часть — проводимости
  g_Na:   14.838           # нСм/пФ
  g_CaL:  5.0e-5           # л/(Ф·с)
  g_to:   0.735
  g_Kr:   0.153
  g_Ks:   0.392
  g_K1:   5.405
  g_K_ATP: 1.59294

  # Ишемия (K-ATP)
  ATPi:  6.8               # мМ  (норма)
  KmATP: 0.0976

  # Кальциевая динамика
  Vmax_up: 0.00058         # мМ/мс
  V_rel:   2.5             # мс⁻¹

# ── Конфигурация прогона ────────────────────────────────────────────────────
config:
  time_start: 0.0
  time_stop:  500000.0     # мс  (500 с = 500 циклов при 1 Гц)
  atol:       1.0e-9
  rtol:       1.0e-9
  max_step:   0.5          # мс
  n_out:      ~            # ~ = None: CVode выбирает точки сам

# ── Режим нагрузки ──────────────────────────────────────────────────────────
mechanics:
  F_afterload: 0.0         # мН  (0 = изометрический режим)

# ── Начальные условия ───────────────────────────────────────────────────────
# Если не указан warmup_file — используется стандартное стационарное состояние.
# Если указан — последняя точка файла становится state0.
#
# warmup_file: data/warmup_1Hz.h5